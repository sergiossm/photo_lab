name: photo_lab
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.20.5
  flutter_riverpod: ^2.6.1
  fpdart: ^1.1.1
  freezed_annotation: ^2.4.4
  go_router: ^14.6.1
  google_sign_in: ^6.2.2
  hooks_riverpod: ^2.6.1
  json_serializable: ^6.9.0
  localizations:
    path: localizations
  rxdart: ^0.28.0
  ui_kit:
    path: ui_kit
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_flavorizr: 2.2.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  very_good_analysis:

flutter:
  uses-material-design: true

# Flutter Flavorizr configuration
flavorizr:
  ide: "vscode"
  app:
    android:
      flavorDimensions: "flavor-type"
    
  flavors:
